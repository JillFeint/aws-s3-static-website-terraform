name: "Terraform CloudNova Deploy"

on:
  push:
    branches:
      - main  # Esto dispara el despliegue automático al hacer push

jobs:
  terraform:
    name: "Auto-Deploy Infrastructure"
    runs-on: ubuntu-latest
    
    steps:
      - name: "1. Checkout Code"
        uses: actions/checkout@v4

      - name: "2. Setup Terraform"
        uses: hashicorp/setup-terraform@v3

      - name: "3. Terraform Init"
        run: terraform init

      - name: "4. Terraform Format & Validate"
        run: |
          terraform fmt -check
          terraform validate

      - name: "5. Terraform Apply"
        env:
          # Aquí conectamos los secretos de GitHub con Terraform
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_region: ${{ secrets.REGION }}
          TF_VAR_bucket_name_root: ${{ secrets.BUCKET_NAME }}
          TF_VAR_project_tags: ${{ secrets.PROJECT_TAGS }}
        run: terraform apply -auto-approve