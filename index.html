<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Terraform - BeTek</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e1b4b 100%);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .info {
            font-size: 1.1rem;
            color: #94a3b8;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 1rem;
        }
        #date {
            font-weight: bold;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bienvenido al examen Terraform</h1>
        
        <div class="info">
            <p>Estudiante: <strong>David Alejandro Ramírez Ramírez</strong></p>

	    <p>Fecha de despliegue: <strong id="date">FECHA_SISTEMA_GITHUB</strong></p>
        </div>

        <div class="tag">BeTek - CloudNova S.A.S</div>
    </div>

</body>
</html>
